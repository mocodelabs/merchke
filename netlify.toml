[build]
  base    = "merchke_frontend"
  command = "npm install && npm run build"
  publish = "merchke_frontend/.next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from   = "/api/*"
  to     = "https://merchke.onrender.com/api/:splat"
  status = 200
